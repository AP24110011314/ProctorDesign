<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB9558" />
      <stop offset="55%" stop-color="#9A5F2B" />
      <stop offset="100%" stop-color="#57693F" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9EA" />
      <stop offset="100%" stop-color="#E9EFE0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2E2A23" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Shield Body (Security & Examination) -->
  <path d="M32 3 C47 3 58 11 58 23 C58 43 43 55 32 61 C21 55 6 43 6 23 C6 11 17 3 32 3 Z"
        fill="url(#shieldGrad)"
        filter="url(#shadow)" />

  <!-- Shield Inner Border Highlight -->
  <path d="M32 5.5 C45.5 5.5 55.5 12.8 55.5 23.5 C55.5 41.5 42 52.5 32 58 C22 52.5 8.5 41.5 8.5 23.5 C8.5 12.8 18.5 5.5 32 5.5 Z"
        fill="none"
        stroke="rgba(255, 255, 255, 0.35)"
        stroke-width="1.5" />

  <!-- Proctoring Eye (Watchful Monitoring) -->
  <path d="M14 31 C20 20 25.5 16 32 16 C38.5 16 44 20 50 31 C44 42 38.5 46 32 46 C25.5 46 20 42 14 31 Z"
        fill="url(#lensGrad)"
        stroke="#2E2A23"
        stroke-width="2.2"
        stroke-linejoin="round" />

  <!-- Iris (Camera / Sensor) -->
  <circle cx="32" cy="31" r="9" fill="#2E2A23" />
  
  <!-- AI Core / Caramel Pupil -->
  <circle cx="32" cy="31" r="5" fill="#DB9558" />

  <!-- Camera Glint / Reflection -->
  <circle cx="34.5" cy="28.5" r="2" fill="#FFFFFF" opacity="0.9" />

  <!-- Verified Checkmark Badge (Integrity / Fair Results) -->
  <circle cx="45" cy="45" r="11" fill="#57693F" stroke="#FFFFFF" stroke-width="2.2" />
  <path d="M40 45 L43.5 48.5 L50.5 41.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
